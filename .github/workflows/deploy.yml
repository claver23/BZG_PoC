name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🔥 PASO NUEVO: Inyectar los secretos en un archivo JS de configuración
      - name: Inject environment variables
        run: |
          echo "// Archivo generado automáticamente por GitHub Actions" > env-config.js
          echo "window.__ENV__ = {" >> env-config.js
          echo "  MOEBIUS_BZG_AGENT_URL: '${{ secrets.MOEBIUS_BZG_AGENT_URL }}'," >> env-config.js
          echo "  MOEBIUS_BZG_MODEL_APIKEY: '${{ secrets.MOEBIUS_BZG_MODEL_APIKEY }}'" >> env-config.js
          echo "};" >> env-config.js
        shell: bash

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4