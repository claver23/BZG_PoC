name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Betty credentials into demo
        env:
          TENANT_ID:     ${{ secrets.BETTY_TENANT_ID }}
          CLIENT_ID:     ${{ secrets.BETTY_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.BETTY_CLIENT_SECRET }}
        run: |
          sed -i \
            -e "s|__TENANT_ID__|${TENANT_ID}|g" \
            -e "s|__CLIENT_ID__|${CLIENT_ID}|g" \
            -e "s|__CLIENT_SECRET__|${CLIENT_SECRET}|g" \
            demo_notaria.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
